name: 🚀 Auto Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🛠 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath
          tools: composer:v2

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

      - name: 🗜 Package vendor as a single archive
        run: |
          cd vendor
          zip -qr ../vendor-deploy.zip .
          cd ..
          ls -lh vendor-deploy.zip

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftp
          port: 21
          timeout: 90000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            /vendor/**
            /tests/**
            /.claude/**
            /.github/**
            .env
            /Dentex_API_Collection.json
            /export_context.php
            /phpunit.xml
            /.editorconfig
            /README.md

      - name: 📦 Extract vendor archive on server
        run: |
          curl -sf "https://dsd.haderin.sy/deploy-unzip.php?secret=${{ secrets.DEPLOYMENT_SECRET }}"

      - name: 🔄 Run post-deploy tasks (migrate + cache clear)
        run: |
          curl -sf "https://dsd.haderin.sy/run-deployment?secret=${{ secrets.DEPLOYMENT_SECRET }}"
