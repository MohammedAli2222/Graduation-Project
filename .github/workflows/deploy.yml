name: 🚀 Auto Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftp
          port: 21
          timeout: 90000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            /vendor/**
            /tests/**
            /.claude/**
            /.github/**
            .env
            /storage/firebase-credentials.json
            /Dentex_API_Collection.json
            /export_context.php
            /phpunit.xml
            /.editorconfig
            /README.md

      - name: 🔄 Run post-deploy tasks (migrate + cache clear)
        run: |
          curl -sf "https://dsd.haderin.sy/run-deployment?secret=${{ secrets.DEPLOYMENT_SECRET }}"
